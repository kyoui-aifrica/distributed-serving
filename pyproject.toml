[project]
name = "distributed-serving"
version = "0.1.0"
description = "H100 x2 vLLM parallelism lab"
requires-python = "==3.12.*"
dependencies = [
    "vllm==0.34.0; sys_platform == 'linux'",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]
